[project]
name = "md2excel"
version = "0.1.0"
description = "Convert Markdown tables to Excel (XLSX) format"
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
dependencies = [
    "spire-xls>=2.0.0",
    "mermaid-cli>=0.1.0"
]
requires-python = ">=3.8,<3.15"

[project.scripts]
md2excel = "md2excel.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
